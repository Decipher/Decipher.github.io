# Prose rules the vale module applies to this site's content.
#
# Beside the web root, where $settings['vale_config'] points (.devtools/provision
# writes that). StylesPath is committed, so nothing needs `vale sync`. The
# root .vale.ini is a different thing: it lints this repository's README in CI.
StylesPath = styles
MinAlertLevel = suggestion

[*]
BasedOnStyles = Decipher
