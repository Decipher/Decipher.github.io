name: CI

# This is a site built on the serverless starterkit, not the starterkit itself,
# so the jobs that prove the template works *as a template* are gone: installing
# it through giget, the no-PHP and old-PHP install guardrails, and the DDEV,
# Lando and dev container setup paths. They test a product this repository is a
# consumer of, take a long time, and can only ever fail for reasons nobody here
# can act on. What is left is what a site needs: it lints, it builds, and the
# authoring layer behaves.

on:
  # Only main on push. A branch with an open pull request used to run the whole
  # suite twice, once for the push and once for the pull request, on identical
  # code. Branches are covered by their pull request; main is covered here.
  push:
    branches: [main]
  pull_request:

# One run per branch. A second push supersedes the first, and there is no value
# in finishing a suite for code nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: nothing here needs write access to the repo.
permissions:
  contents: read

jobs:
  # Root-level tooling only (package.json at the repo root) - none of this
  # needs PHP/Composer or nuxt/'s own dependencies.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 22, not this repo's pinned 16 (or the other jobs' 20) - the
          # lint tools themselves need it: cspell requires >=22.18.0,
          # markdownlint-cli2 >=22, commitlint >=22.12.0. This job only
          # runs root-level tooling, never touches the app's own runtime.
          node-version: '22.23.2'
          cache: 'npm'

      - run: npm install

      - name: ESLint (scripts/)
        run: npm run lint:js

      - name: Prettier
        run: npm run lint:format

      - name: cspell
        run: npm run lint:cspell

      - name: markdownlint
        run: npm run lint:md

      - name: knip (unused/unlisted dependencies)
        run: npm run lint:knip

      - name: npm audit (production dependencies)
        run: npm run lint:audit

      - name: renovate-config-validator
        run: npm run lint:renovate

      # This repository is public and is what people copy to start a
      # site, so a URL only the author can reach is a defect in the
      # published artefact, not a stray comment.
      - name: Private host references
        run: npm run lint:private

      # Only checks the most recent commit - good enough to catch the
      # common case (a single non-conforming commit message) without the
      # complexity of resolving a full PR commit range.
      - name: commitlint
        run: npx commitlint --from HEAD~1 --to HEAD --verbose

      - name: JSON sweep
        run: |
          rc=0; count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "  [PASS] $f"
            else
              echo "  [FAIL] $f"
              rc=1
            fi
          done < <(find . -name '*.json' -not -path '*/.git/*' -not -path '*/node_modules/*' \
            -not -path '*/nuxt/*' -not -path '*/drupal/*' -not -path '*/.vscode/*' -not -path '*/.devcontainer/*' -print0)
          echo "--- $count JSON file(s) checked ---"
          exit "$rc"

      - name: Shell syntax sweep
        run: |
          rc=0; count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if bash -n "$f" 2>/dev/null; then
              echo "  [PASS] $f"
            else
              echo "  [FAIL] $f"
              rc=1
            fi
          done < <(find . -name '*.sh' -not -path '*/.git/*' -not -path '*/node_modules/*' \
            -not -path '*/nuxt/*' -not -path '*/drupal/*' -print0)
          echo "--- $count shell file(s) checked ---"
          exit "$rc"

      - name: yamllint
        run: |
          pip install yamllint -q
          yamllint -d "{extends: default, rules: {line-length: {max: 200, level: warning}}}" .gitlab-ci.yml .github/workflows/ci.yml

      # Prose-quality lint for README.md - see .vale.ini for scoping/exceptions.
      - name: Install Vale
        run: |
          vale_version="3.17.1"
          vale_sha256="db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd"
          curl -sL --max-time 60 "https://github.com/vale-cli/vale/releases/download/v${vale_version}/vale_${vale_version}_Linux_64-bit.tar.gz" -o /tmp/vale.tar.gz
          echo "${vale_sha256}  /tmp/vale.tar.gz" | sha256sum -c - || { echo "vale checksum mismatch" >&2; exit 1; }
          sudo tar -xzf /tmp/vale.tar.gz -C /usr/local/bin vale
          sudo chmod +x /usr/local/bin/vale

      - name: Install ai-tells style package
        run: |
          ai_tells_version="1.31.0"
          ai_tells_sha256="bc1267248f13e65928475c439ad7ae1bf806a20d09254c08d7d8c4a9c8b811f0"
          curl -sL --max-time 60 "https://github.com/tbhb/vale-ai-tells/releases/download/v${ai_tells_version}/ai-tells.zip" -o /tmp/ai-tells.zip
          echo "${ai_tells_sha256}  /tmp/ai-tells.zip" | sha256sum -c - || { echo "ai-tells checksum mismatch" >&2; exit 1; }
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('/tmp/ai-tells.zip') as z:
              for name in z.namelist():
                  if name.startswith('ai-tells/styles/') and not name.endswith('/'):
                      target = os.path.join('styles', name[len('ai-tells/styles/'):])
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with open(target, 'wb') as f:
                          f.write(z.read(name))
          "

      - name: Vale
        run: vale README.md

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, intl, gd, xml, zip, opcache

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # setup-node v5 turned caching on by itself when package.json
          # names a package manager, and keys it on the root lockfile
          # alone. This job installs from nuxt/, so name both.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            nuxt/package-lock.json

      - name: Validate and install Composer dependencies
        working-directory: drupal
        run: composer validate --strict && composer install --no-interaction --no-progress

      # Not `npm run build`/`generate` - Druxt fetches the JSON:API index
      # at build time, so building needs a live Drupal backend. That
      # happens in test_generate, via .devtools/.
      - name: Install Nuxt dependencies
        working-directory: nuxt
        run: npm install

      - name: Create .env
        run: cp .env.example .env

  test_generate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, intl, gd, xml, zip, opcache

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # setup-node v5 turned caching on by itself when package.json
          # names a package manager, and keys it on the root lockfile
          # alone. This job installs from nuxt/, so name both.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            nuxt/package-lock.json

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('drupal/composer.lock') }}

      - name: Install Composer dependencies
        working-directory: drupal
        run: composer install --no-interaction --no-progress

      - name: Assemble
        working-directory: drupal
        run: .devtools/assemble

      - name: Provision
        working-directory: drupal
        run: .devtools/provision

      - name: Start backend
        working-directory: drupal
        run: .devtools/start

      - name: Install Nuxt dependencies
        working-directory: nuxt
        run: npm install

      # This repo's whole point is full static output with no live
      # backend at runtime - the meaningful test is that `nuxt generate`
      # actually succeeds against a real backend and produces real
      # static files.
      - name: Generate full static output
        working-directory: nuxt
        run: npm run generate

      - name: Verify static output
        working-directory: nuxt
        run: |
          test -s dist/index.html
          ls dist/_nuxt/*.js > /dev/null

      # Always, not just on failure: the browser suite runs against this exact
      # build rather than provisioning Drupal a second time.
      - name: Upload the static output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuxt-dist
          path: nuxt/dist

  # node:test and node:assert only, so this needs no install and no PHP.
  test_scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Run the script tests
        run: npm run test:scripts

  # The authoring layer's decisions, with no browser and no backend.
  test_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - run: npm install
      - run: npm run test:unit

  # The login flow against a stubbed backend. Stubbed on purpose: these assert
  # what the frontend does with each answer a backend can give, including the
  # awkward ones a real Drupal cannot be made to produce on demand.
  test_e2e:
    needs: test_generate
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the static build the generate job produced
        uses: actions/download-artifact@v7
        with:
          name: nuxt-dist
          path: nuxt/dist

      - name: Cache root dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - run: npm install
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/

  # This site's design, so this site's baselines.
  #
  # arm64 on purpose. Chromium renders text differently on arm64 and x86_64, so
  # a baseline set only matches the architecture that produced it. The committed
  # set is arm64, which is what the GitLab runner and the development containers
  # here are, so this matches them rather than demanding a second set that would
  # have to be regenerated, reviewed and kept in step for the life of the site.
  test_visual:
    needs: test_generate
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the static build the generate job produced
        uses: actions/download-artifact@v7
        with:
          name: nuxt-dist
          path: nuxt/dist

      - name: Cache root dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - run: npm install
      - run: npm run test:visual

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diff
          path: |
            test-results/
            playwright-report/
